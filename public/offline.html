<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline – SyncFloww</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0f;color:#e2e2e8;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
    .container{max-width:420px}
    .icon{font-size:4rem;margin-bottom:1.5rem}
    h1{font-size:1.5rem;font-weight:700;margin-bottom:.75rem}
    p{color:#9494a8;line-height:1.6;margin-bottom:1.5rem}
    button{background:#6366f1;color:#fff;border:none;padding:.75rem 2rem;border-radius:.5rem;font-size:1rem;cursor:pointer;transition:background .2s}
    button:hover{background:#4f46e5}
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. SyncFloww needs a connection to work. Please check your network and try again.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
